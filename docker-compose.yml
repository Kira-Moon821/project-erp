# MySQL 8 本地实例（作品集可复现用）
# 用法：
#   1) 启动本地 Docker Desktop
#   2) docker compose up -d
#   3) 把 .env 的 DATABASE_URL 换成：
#      mysql+pymysql://erp:erp_password@127.0.0.1:3306/erp_db?charset=utf8mb4
#   4) python scripts/seed_db.py --reset
services:
  mysql:
    image: mysql:8.4
    container_name: erp-analytics-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: erp_db
      MYSQL_USER: erp
      MYSQL_PASSWORD: erp_password
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max_connections=200
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/mysql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:
